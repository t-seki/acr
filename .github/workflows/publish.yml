name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # NOTE: consider adding `environment: crates-io` once a matching GitHub
    # environment is created and the crates.io trusted publisher is scoped to
    # it. That adds another approval gate before cargo publish runs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Passed explicitly rather than inherited. On the action's `master`
          # branch `toolchain` is `required: true` with no default; the `stable`
          # branch this pin tracks is a generated branch whose only change is to
          # rewrite that back to `required: false` / `default: stable`. Relying
          # on that rewrite is an implicit dependency, and this workflow is a
          # bad place to hold one: it never runs on pull requests, so nothing
          # here is exercised until a release tag is pushed.
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
