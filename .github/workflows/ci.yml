name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Same digest as the other jobs, so Renovate keeps all four in step. The
      # pin itself comes from the action's `stable` branch, but what this job
      # installs is the `toolchain` input below -- not stable. The trailing
      # comment must stay a bare `# stable`, like the other jobs: Renovate reads
      # it as the ref to follow for the digest.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Keep this equal to `rust-version` in Cargo.toml. Quoted on purpose:
          # bare 1.88 is a YAML float, and a future 1.90 would silently become
          # 1.9. renovate.json disables Renovate's update of this value, which
          # would otherwise move the MSRV check to the latest release.
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # `rust-version` in Cargo.toml already keeps resolver v3 from pulling in
      # dependencies that need a newer compiler. What this job adds is catching
      # acr's own code reaching for a language feature newer than 1.88.
      - run: cargo check --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # `arguments` is a single interpolated slot in the action's `args:`,
          # so whatever is set here REPLACES the action default of
          # `--all-features`, which would otherwise override
          # `[graph] all-features = false` in deny.toml. Keeping that default
          # out preserves the dependency graph the config describes, while
          # `--locked` makes cargo-deny audit the committed Cargo.lock rather
          # than a graph it re-resolved. `--locked` must stay ahead of the
          # `check` subcommand: it is a top-level cargo-deny option, and the
          # action expands `arguments` before `command`.
          arguments: "--locked"

  renovate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Runs on every PR rather than behind a `paths` filter: ci.yml has no
      # workflow-level `paths`, and the job takes seconds. The validator version
      # is pinned here and bumped by hand -- Renovate does not read versions out
      # of a `run:` line. Nothing ties it to the Renovate that actually runs, so
      # a newer Renovate may accept options this version rejects, or the reverse.
      - run: npx --yes --package renovate@44.167.5 -- renovate-config-validator renovate.json
